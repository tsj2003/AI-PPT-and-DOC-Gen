[build]
  base = "frontend/"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API redirects (when you deploy backend separately)
[[redirects]]
  from = "/api/*"
  to = "https://ai-ppt-and-doc-gen.onrender.com/:splat"
  status = 200
  force = true
